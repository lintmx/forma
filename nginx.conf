server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Referrer-Policy "no-referrer" always;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Referrer-Policy "no-referrer" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
