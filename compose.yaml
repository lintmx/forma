services:
  forma:
    build: .
    ports:
      - "${FORMA_BIND:-127.0.0.1}:${FORMA_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PLAYGROUND_ENABLED: "${PLAYGROUND_ENABLED:-false}"
      RENDER_CONCURRENCY: "${RENDER_CONCURRENCY:-2}"
      RENDER_QUEUE_LIMIT: "${RENDER_QUEUE_LIMIT:-16}"
      RENDER_TIMEOUT_MS: "${RENDER_TIMEOUT_MS:-30000}"
      MAX_WIDTH: "${MAX_WIDTH:-8192}"
      MAX_HEIGHT: "${MAX_HEIGHT:-32768}"
      MAX_RASTER_PIXELS: "${MAX_RASTER_PIXELS:-128000000}"
      MAX_OUTPUT_BYTES: "${MAX_OUTPUT_BYTES:-67108864}"
      MAX_PIXELS: "${MAX_PIXELS:-32000000}"
      IMAGE_CACHE_BYTES: "${IMAGE_CACHE_BYTES:-33554432}"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
